name: CI

on:
  push:
    branches: [ main, refactor/layers, feature/domain-tests ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linting & Testing Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pytest-cov pydantic pydantic-settings import-linter
        pip install -e .

    - name: Run Linters and Tests
      env:
        PYTHONPATH: src
      run: |
        ruff check .
        ruff format --check .
        mypy src tests
        pytest

    - name: Architecture contracts
      env:
        PYTHONPATH: src
      run: lint-imports
