[project]
name = "jobradar"
version = "0.1.0"
description = "Збір і аналіз вакансій"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]
[project.scripts]
jobradar = "jobradar.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.ruff]
line-length = 100
target-version = "py312"