[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "0.1.0"
description = "Аналізатор бюджету громади"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "jobradar"
sys_path_dir = "src"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["jobradar.domain"]
forbidden_modules = ["jobradar.services", "jobradar.sources", "jobradar.cli"]

[[tool.importlinter.contracts]]
name = "Services do not know adapters"
type = "forbidden"
source_modules = ["jobradar.services"]
forbidden_modules = ["jobradar.sources", "jobradar.cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=jobradar --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/jobradar/__main__.py",
    "src/jobradar/domain/parsing.py",
    "src/jobradar/sources/schemas.py",
    "src/jobradar/sources/csv_file.py",
]
dependencies = [
"pydantic>=2.7",
"pydantic-settings>=2.3",
"sqlalchemy>=2.0",
"alembic>=1.13",
]